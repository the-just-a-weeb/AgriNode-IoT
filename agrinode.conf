# AgriNode: public MQTT broker -> Telegraf -> InfluxDB Cloud
[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://broker.emqx.io:1883"]
  topics = ["agrinode/uts-roshanben-agri-4821/telemetry"]
  data_format = "json"
  client_id = "telegraf-uts-roshanben-agri-4821"
  connection_timeout = "30s"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "agrinode/+/telemetry"
    measurement = "_/_/measurement"
    tags = "_/node/_"

[[outputs.influxdb_v2]]
  urls = ["https://eu-central-1-1.aws.cloud2.influxdata.com"]
  token = "######" // Hidden on purpose
  organization = "54c978c4f63e6016"
  bucket = "agrinode"
